[project]
name = "democrasim"
version = "0.2.0"
description = "Do elections track welfare when voters misperceive policy impacts? A simulation on real households and encoded reforms, with perception as the one labeled assumption."
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.14"
authors = [{ name = "Max Ghenis", email = "max@policyengine.org" }]
keywords = [
    "elections",
    "voting",
    "microsimulation",
    "policy",
    "welfare",
    "misperception",
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Only needed to REBUILD the measured dataset. The committed artifact under
# democrasim/data/ is enough for everything else.
engine = ["policyengine[us]>=4.20.2"]

[project.scripts]
democrasim = "democrasim.cli:main"

[project.urls]
Repository = "https://github.com/MaxGhenis/democrasim"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["democrasim"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Math notation (σ, Φ, δ, ×, subscripts) is used deliberately in docstrings
# and comments throughout; it reads better than ASCII approximations.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "engine: requires the policyengine engine stack (deselect with '-m \"not engine\"')",
]
